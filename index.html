<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>todo</title>
  </head>
  <body>
    <div id="app"></div>
    <div class="container">
      <h1>ToDo App</h1>
     <form class="todo-form">
      <input type="text" placeholder="Add a new todo" id="todo-input"/>
      <button type="submit">Add</button>
     </form>
     <p id="error-message">Please enter a todo item</p>

     <!-- Progress bar and text counter (Option 10) -->
     <div style="margin: 15px 0;">
        <progress id="progress-bar" value="0" max="100" style="width: 100%; height: 8px;"></progress>
        <p id="progress-text" style="font-size: 11px; text-align: center; margin: 4px 0; color: #666;">0% completed</p>
      </div>

     <ul class="todo-list" id="todo-list">

     </ul>

     <input type="color" id="color-Picker"/>

    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
